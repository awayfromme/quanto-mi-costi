# 'E paggene da tené d'uocchio e comme se riconosce ogni piano dint' 'o testo.
#
# match:    regex (maiuscole o minuscole è uguale) ca trova 'a riga cu 'o nomme d' 'o piano
# exclude:  regex si vuò: si 'a riga 'a tene, NUN è chistu piano
#           (serve pe' nun mmescà "Standard" cu "Standard con pubblicità")
# lookahead: quante righe doppo 'o nomme se cerca 'o prezzo (si nun dice niente, 6)
# min/max:  'o prezzo ca se pò credere, in euro; fora 'e chisto = estrazione ca puzza
#
# ⚠️ Appunì: ll'URL s'hanno 'a cuntrullà da n'IP italiano primma 'e jì in produzione:
#    'e site cagnano spisso comme so' fatte 'e paggene d' 'e prezze.

netflix:
  url: https://help.netflix.com/it/node/24926   # paggena d'aiuto "Piani e prezzi"
  wait_for: body
  plans:
    base_ads:
      match: 'standard con pubblicit'
      min: 3
      max: 15
    standard:
      match: '^\s*standard\b'
      exclude: 'pubblicit'
      min: 8
      max: 25
    premium:
      match: '^\s*premium\b'
      min: 12
      max: 35

spotify:
  url: https://www.spotify.com/it/premium/
  wait_for: body
  plans:
    premium:
      match: '^\s*(premium\s+)?individual'
      min: 7
      max: 20
    duo:
      match: '^\s*(premium\s+)?duo'
      min: 10
      max: 25
    family:
      match: '^\s*(premium\s+)?family'
      min: 12
      max: 30
    student:
      match: '^\s*(premium\s+)?student'
      min: 3
      max: 12

# Paggena d'aiuto "Piani e prezzi", no 'a home: 'a home mette nnanze 'e prezze
# 'e offerta cu 'o vincolo 'e 6 mise ("A partire da ...") primma d' 'o listino.
# 'E regex so' attaccate â fine d' 'a riga pecché abbascio â paggena ce stanno
# righe "Disney+ Standard: 6,99 € al mese" ca nun so' 'o listino.
disney_plus:
  url: https://help.disneyplus.com/it/article/disneyplus-price
  wait_for: body
  plans:
    standard_ads:
      match: '^disney\+\s+standard con pubblicit[aà]$'
      lookahead: 8
      min: 3
      max: 15
    standard:
      match: '^disney\+\s+standard$'
      lookahead: 8
      min: 6
      max: 20
    premium:
      match: '^disney\+\s+premium$'
      lookahead: 8
      min: 8
      max: 30
