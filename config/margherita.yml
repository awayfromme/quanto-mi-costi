# Indice Margherita: segnalaziune d' 'a gente cu nu modulo 'e fore
# (Tally, Google Moduli...). Maje date pigliate d' 'e app d' 'e consegne.

# 'O link pubblico d' 'o modulo, ca se vede ncopp' ô sito. Vacante = "modulo in arrivo".
form_url: ""

# Na città trase dint' a ll'indice pe' nu mese sulo cu almeno chisti tante
# pizzerie diverse: cu 'e meno, nu prezzo stuorto sulo facesse 'o titolo.
min_pizzerias: 3

# 'O prezzo ca se pò credere, in euro, pe' na margherita ô tavolo.
min: 2
max: 25

# 'E nomme d' 'e colonne dint' a ll'export CSV d' 'o modulo. Appunì: si
# cagne 'o nomme 'e na domanda dint' 'o modulo, cagnalo pure ccà.
columns:
  id: "Submission ID"        # cu Google Moduli: "Informazioni cronologiche"
  date: "Data"               # quanno he visto 'o prezzo (gg/mm/aaaa o aaaa-mm-gg)
  city: "Città"
  pizzeria: "Pizzeria"
  price: "Prezzo"
  photo: "Foto"              # foto d' 'o menu o d' 'o scontrino (ce vo' pe' forza)
  consent: "Consenso"        # 'a casella CC BY 4.0: senza 'o sì, 'a segnalazione se jetta
