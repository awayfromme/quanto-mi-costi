# 'O giro 'e ogni juorno d' 'o monitor d' 'e prezze, cu 'o "git scraping": ogni
# cagnamento 'e testo dint' 'e paggene o dint' 'e file pending addiventa nu commit.
#
# ⚠️ Appunì: 'e runner 'e GitHub stanno 'n America e vedessero 'e prezze americane.
# Ce vo' nu runner self-hosted cu n'IP italiano (na VPS in Italia o 'o homelab
# tuojo) registrato cu ll'etichetta "italy".

name: monitor-prezzi

on:
  schedule:
    - cron: "17 6 * * *"   # ogni juorno ê 6:17 UTC (minuto stuorto pe' nun fà 'a fila)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    # Appunì: checkout@v7 gira cu Node 24, 'o runner ha da essere na versione recente.
    runs-on: [self-hosted, italy]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Test
        run: bundle exec rake test

      - name: Monitor
        run: bundle exec bin/monitor
        continue-on-error: true   # si nu sito è caduto, nun ha da fermà 'o commit 'e ll'ate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit snapshot e proposte
        run: |
          git config user.name  "monitor-prezzi"
          git config user.email "monitor@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
