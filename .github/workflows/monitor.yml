# Giro giornaliero del monitor prezzi, con "git scraping": ogni cambio
# di testo nelle pagine o nei file pending diventa un commit.
#
# ⚠️ I runner di GitHub sono negli USA e vedrebbero i prezzi americani.
# Serve un runner self-hosted con IP italiano (una VPS in Italia o il tuo
# homelab) registrato con l'etichetta "italy".

name: monitor-prezzi

on:
  schedule:
    - cron: "17 6 * * *"   # ogni giorno alle 6:17 UTC (minuto non tondo per evitare la coda)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    # Appunì: checkout@v7 gira cu Node 24, 'o runner ha da essere na versione recente.
    runs-on: [self-hosted, italy]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Test
        run: bundle exec rake test

      - name: Monitor
        run: bundle exec bin/monitor
        continue-on-error: true   # un sito giù non deve bloccare il commit degli altri
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit snapshot e proposte
        run: |
          git config user.name  "monitor-prezzi"
          git config user.email "monitor@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
